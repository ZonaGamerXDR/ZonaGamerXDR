<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XDR | GALERÍA</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* --- ESTILOS BASE (MANTENIDOS) --- */
        :root {
            --neon-cyan: #00f0ff; --neon-magenta: #ff00ff;
            --bg-black: #050505;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: var(--bg-black); 
            color: #fff; 
            font-family: 'Rajdhani', sans-serif; 
            overflow-x: hidden; 
            padding-bottom: 50px; 
        }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: -1; pointer-events: none; background-size: 100% 2px, 3px 100%;
        }

        /* NAVEGACIÓN (MANTENIDA) */
        nav {
            background: rgba(0,0,0,0.9); border-bottom: 1px solid var(--neon-cyan);
            padding: 15px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(5px);
        }
        .logo { font-family: 'Orbitron'; font-weight: 900; color: var(--neon-cyan); text-decoration: none; font-size: 1.5rem; }
        .back-btn { color: #fff; text-decoration: none; font-family: 'Orbitron'; font-size: 0.9rem; border: 1px solid #333; padding: 5px 15px; transition: 0.3s; }
        .back-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; text-align: center; }
        .page-title { font-family: 'Orbitron'; font-size: 2.5rem; color: var(--neon-cyan); margin-bottom: 10px; }
        .page-subtitle { color: #888; margin-bottom: 40px; letter-spacing: 2px; }

        /* --- NUEVO GRID DE GALERÍA (ESTABLE Y SIN PARPADEO) --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .gallery-item {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1; /* Cuadrado perfecto */
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
            overflow: hidden;
            transition: 0.3s;
        }

        .gallery-item:hover {
            border-color: var(--neon-magenta);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
            transform: scale(1.02);
        }

        .gallery-item img {
            width: 100%; height: 100%;
            object-fit: cover; /* Recorta para encajar */
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .img-loaded { opacity: 1 !important; }

        .gallery-caption {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.8); color: var(--neon-cyan);
            padding: 8px; font-size: 0.7rem; font-family: 'Orbitron';
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <nav>
        <a href="index.html" class="logo">XDR</a>
        <a href="index.html" class="back-btn">VOLVER AL MENU</a>
    </nav>

    <div class="container">
        <h1 class="page-title">VIDA EN XDR</h1>
        <p class="page-subtitle">NUESTRA COMUNIDAD, EVENTOS Y ESPACIOS</p>

        <div id="gallery-container" class="gallery-grid">
            <div style="color: var(--neon-cyan); grid-column: 1/-1;">SINCRONIZANDO GALERÍA...</div>
        </div>
    </div>

    <script>
        async function cargarGaleria() {
            const usuario = "ZonaGamerXDR";
            const repo = "ZonaGamerXDR";
            const ruta = "lib_img/galeria";
            const container = document.getElementById('gallery-container');

            try {
                // Llamada a la API de GitHub para listar archivos
                const response = await fetch(`https://api.github.com/repos/${usuario}/${repo}/contents/${ruta}`);
                const archivos = await response.json();

                if (!Array.isArray(archivos)) return;

                container.innerHTML = ""; // Limpiamos el mensaje de carga

                archivos.forEach(archivo => {
                    // Filtrar solo imágenes
                    if (archivo.name.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
                        const item = document.createElement('div');
                        item.className = 'gallery-item';

                        // Usamos la URL cruda para evitar parpadeos
                        const rawUrl = `https://raw.githubusercontent.com/${usuario}/${repo}/main/${ruta}/${archivo.name}`;
                        
                        const img = new Image();
                        img.src = rawUrl;
                        
                        img.onload = () => img.classList.add('img-loaded');
                        img.onerror = () => item.style.display = 'none';

                        item.innerHTML = `
                            <div class="gallery-caption">${archivo.name.split('.')[0]}</div>
                        `;
                        item.prepend(img);
                        container.appendChild(item);
                    }
                });
            } catch (e) {
                console.error("Error cargando galería:", e);
                container.innerHTML = "<p>Error al conectar con el servidor de imágenes.</p>";
            }
        }

        window.onload = cargarGaleria;
    </script>
</body>
</html>
