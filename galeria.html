<style>
    /* Diseño de mosaico profesional con tamaños alineados */
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        padding: 20px;
    }

    .gallery-item {
        position: relative;
        height: 280px; /* Tamaño fijo para todas las celdas */
        background: #0a0a0a;
        border: 1px solid #222;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Ajusta y recorta la imagen automáticamente al cuadro */
        transition: transform 0.5s ease;
        opacity: 0.9;
    }

    .gallery-item:hover img {
        transform: scale(1.1);
        opacity: 1;
    }

    .gallery-caption {
        position: absolute;
        bottom: 0;
        width: 100%;
        background: rgba(0, 240, 255, 0.1);
        backdrop-filter: blur(5px);
        color: #00f0ff;
        padding: 8px;
        font-family: 'Orbitron';
        font-size: 10px;
        text-align: center;
        border-top: 1px solid rgba(0, 240, 255, 0.3);
    }
</style>

<div id="gallery-container" class="gallery-grid">
    </div>

<script>
    async function cargarGaleriaGitHub() {
        const usuario = "ZonaGamerXDR"; // Tu usuario de GitHub
        const repo = "ZonaGamerXDR";    // Tu repositorio
        const ruta = "lib_img/galeria"; // La carpeta de las fotos
        
        const container = document.getElementById('gallery-container');
        
        try {
            // Consultamos la lista de archivos directamente a GitHub
            const response = await fetch(`https://api.github.com/repos/${usuario}/${repo}/contents/${ruta}`);
            const archivos = await response.json();

            container.innerHTML = ""; // Limpiar mensaje de carga

            archivos.forEach((archivo) => {
                // Solo procesamos archivos que sean imágenes
                if (archivo.name.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    
                    item.innerHTML = `
                        <img src="${archivo.download_url}" alt="XDR Evento">
                        <div class="gallery-caption">${archivo.name.toUpperCase()}</div>
                    `;
                    container.appendChild(item);
                }
            });
        } catch (error) {
            console.error("Error cargando la carpeta de GitHub:", error);
            container.innerHTML = "<p style='color:red;'>Error al conectar con el servidor de imágenes.</p>";
        }
    }

    // Iniciar la carga al abrir la página
    cargarGaleriaGitHub();
</script>
