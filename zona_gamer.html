<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XDR | ZONA GAMER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* --- ESTILOS BASE (Mismos del Landing) --- */
        :root {
            --neon-cyan: #00f0ff; --neon-magenta: #ff00ff; --neon-green: #39ff14;
            --neon-red: #ff003c; --neon-purple: #bc13fe; --bg-black: #050505;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-black); color: #fff; font-family: 'Rajdhani', sans-serif; overflow-x: hidden; padding-bottom: 80px; }

        /* FONDOS */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: -1; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        /* NAVEGACIÓN COMPACTA */
        nav {
            background: rgba(0,0,0,0.9); border-bottom: 1px solid var(--neon-cyan);
            padding: 15px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(5px);
        }
        .logo { font-family: 'Orbitron'; font-weight: 900; color: var(--neon-cyan); text-decoration: none; font-size: 1.5rem; }
        .back-btn { color: #fff; text-decoration: none; font-family: 'Orbitron'; font-size: 0.9rem; border: 1px solid #333; padding: 5px 15px; transition: 0.3s; }
        .back-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); }

        /* CONTENEDOR */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .page-title {
            font-family: 'Orbitron'; font-size: 2.5rem; text-align: center; color: var(--neon-cyan);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.4); margin-bottom: 10px;
        }
        .page-subtitle { text-align: center; color: #888; margin-bottom: 40px; letter-spacing: 2px; }

        /* GRID DE EQUIPOS */
        .hardware-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px; margin-bottom: 50px;
        }

        .card {
            background: #111; border: 1px solid #333; padding: 20px;
            position: relative; overflow: hidden; transition: 0.3s;
            border-bottom: 4px solid var(--neon-cyan); display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 0 20px rgba(0, 240, 255, 0.1); }
        
        .icon-box {
            width: 100%; height: 150px; background: rgba(0,0,0,0.3); margin-bottom: 15px;
            display: flex; align-items: center; justify-content: center; border: 1px dashed #333;
        }
        .icon-box img { max-width: 80%; max-height: 80%; object-fit: contain; filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); }

        .card h3 { font-family: 'Orbitron'; margin-bottom: 10px; color: #fff; font-size: 1.4rem; }
        .card ul { list-style: none; color: #aaa; padding-left: 5px; }
        .card ul li { margin-bottom: 8px; border-left: 3px solid var(--neon-cyan); padding-left: 10px; font-size: 0.95rem; }

           </div>
        <div class="reserve-section">            <a href="eventos.html" class="btn-redirect-reserve">                ¿DESEA RESERVAR?            </a>            <p class="reserve-hint">RESERVA TU ESTACIÓN O EVENTO EN NUESTRO NUEVO SISTEMA</p>        </div>
    </div></body></html>
